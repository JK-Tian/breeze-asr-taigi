[project]
name = "video-to-notes"
version = "0.1.0"
description = "視訊會議轉高階會議記錄自動化工具 (Video to Meeting Notes Generator)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

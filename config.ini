[Diarization]
# 滑動視窗的長度 (秒)。建議值：1.5 ~ 4.0。太短特徵會不穩定，太長無法偵測短插話。
window_size_s = 5.0

# 每次滑動前進的步長 (秒)。建議值：0.5 ~ 1.5。步長越短，時間軸解析度越高，但運算時間會增加。
step_s = 1.5

# 講者分群的相似度門檻 (Cosine Distance)。建議值：0.65 ~ 0.85。
distance_threshold = 0.75

[Correction]
# 語意錯別字校正模型服務端點 (專責階段一：逐字稿同音字與專有名詞校正)
correction_url = http://192.168.1.100:8001/v1
# 模型名稱 (設為 auto 會自動向 /v1/models 查詢動態帶入)
correction_model = auto
# 錯別字校正 Prompt
correction_prompt = 你是一位專業的中文與台灣台語語音轉錄校對專家。以下是一段由 ASR 產生的會議逐字稿。語音轉寫過程中可能包含同音錯別字、專有名詞誤辨或贅字。請在嚴格遵守以下規則的前提下進行校正：1. 根據前後文語意修復錯別字、同音字及專有名詞。2. 務必完整保留每一行開頭的講者標籤與時間戳記（例如：[00:01:23] 講者 A:），切勿刪除或修改任何時間軸與講者標籤。3. 直接輸出校正後的逐字稿全文，切勿輸出任何引言、開場白或額外解釋。以下是原始逐字稿內容：

[LLM]
# 會議記錄模型端點與名稱
llm_url = http://192.168.1.100:8002/v1
llm_model = auto
# 結構化會議記錄摘要 System Prompt 提示詞
summary_prompt = 請用繁體中文，以專業「會議記錄者」的客觀視角，將校正後的逐字稿整理為高規格的結構化會議紀錄。請務必嚴格遵循以下 Markdown 格式輸出，且第一行必須是會議名稱：\n\n# 會議名稱：[請提煉出簡短明確的會議核心主題]\n\n## 【會議重點】\n- 詳細整理會議討論的核心論點、背景與主要議題。\n\n## 【關鍵決策】\n- 條列會議中達成的所有明確共識、決議與結論。\n\n## 【TODO / 行動項目】\n- 條列具體待辦事項，格式務必包含負責人及預計完成日期（若逐字稿中未提及則寫「未提及」）。\n\n## 【下次會議追蹤項目】\n- 列出需要在下次會議追蹤、複查或延續討論的事項。\n\n注意：保持客觀嚴謹，不可憑空捏造人物、日期或未提及的決議。以下為會議逐字稿：

[KMWiki]
# KM Wiki 自動同步開關 (預設啟用)
enabled = true
# KM Wiki 的 Minutes 知識庫 raw 檔區目錄路徑
raw_dir = D:/km_wiki/Minutes/raw
# 是否自動建立日期子目錄 YYYY-MM-DD (預設 true)
date_subfolder = true

[Vision]
# 多模態視訊關鍵幀抽取與視覺理解開關
enabled = true
# 多模態模型端點與模型名稱 (vLLM OpenAI 相容規格)
vlm_url = http://192.168.1.100:8000/v1
vlm_model = auto
# 簡報投影片換頁偵測敏感度 (0.1 ~ 1.0)
scene_threshold = 0.3
# 關鍵幀最小抽取間隔 (秒)
min_interval_seconds = 15
# 單一會議錄影最大關鍵幀上限
max_keyframes = 30

[Server]
# 前端與後端允許的最大上傳檔案大小 (MB)
max_upload_size_mb = 2048

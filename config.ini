[Diarization]
# 滑動視窗的長度 (秒)。建議值：1.5 ~ 4.0。太短特徵會不穩定，太長無法偵測短插話。
# 改為 3.0 秒讓特徵更穩定，減少假講者數量
window_size_s = 5.0

# 每次滑動前進的步長 (秒)。建議值：0.5 ~ 1.5。步長越短，時間軸解析度越高，但運算時間會增加。
# 改為 1.0 秒，避免產生過多瑣碎的雜訊碎片
step_s = 1.5

# 講者分群的相似度門檻 (Cosine Distance)。建議值：0.65 ~ 0.85。
# 數值越小 (嚴格)，越容易把同一個人切成不同講者；數值越大 (寬鬆)，越容易把不同人誤認為同一個人。
distance_threshold = 0.75

[LLM]
# 摘要生成的 System Prompt 提示詞
# 系統會在這段提示詞後面自動接上逐字稿內容送給 Ollama
summary_prompt = 請用繁體中文，以'會議記錄者'的角度，客觀地總結會議的核心論點、關鍵決議和具體行動項目。確保重點整理簡潔明瞭，易於理解，並包含所有重要資訊。行動項目要列出負責人及負責日期。不可虛構人物、日期與時間，不知道的就留空即可。以下是會議逐字稿：
